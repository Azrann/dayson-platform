<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Dayson</title>
    <base href="/">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <style>
        .splash-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .loader {
            display: block;
        }
        
        .loader-text {
            margin-top: 10px;
            font-size: 24px;
            opacity: 0.3;
        }
    </style>

    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,700|Roboto:300,400,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- <script>
        console.warn('Fonts deactivated in index.html');
    </script> -->
</head>

<body>
    <daysonapp-root>
        <div class='splash-container page-background'>
            <div class='loader ball-scale-ripple'>
                <div></div>
            </div>
        </div>
    </daysonapp-root>
</body>


</html>
