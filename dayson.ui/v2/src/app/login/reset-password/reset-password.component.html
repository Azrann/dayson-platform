<daysonapp-header subtitle='Reset your password'>
</daysonapp-header>

<div fxLayout='row' fxLayoutAlign='center center'>
    <form novalidate autocomplete="off" (ngSubmit)="reset()" #rpForm='ngForm' fxLayout='column' fxLayoutAlign='start stretch'>

        <p>
            Please enter your new password
        </p>

        <mat-form-field>
            <input name="passwordInput" matInput type="password" placeholder="Password" required #passwordInput='REPLACE_WITH_YOUR_VALUE' [(ngModel)]='password'
                [disabled]='this.success || this.submitting' minlength="6" daysonappValidationRefresh='repeatPasswordInput'>
            <mat-error>
                <div *ngIf='passwordInput.errors?.required'>You must enter your new password</div>
                <div *ngIf='passwordInput.errors?.minlength'>Password must be at least 6 characters long</div>
            </mat-error>
        </mat-form-field>

        <mat-form-field>
            <input name="repeatPasswordInput" matInput type="password" minlength="6" placeholder="Repeat password" required [(ngModel)]='repeatPassword'
                #repeatPasswordInput='REPLACE_WITH_YOUR_VALUE' [disabled]='this.success || this.submitting' daysonappRepeat='passwordInput'>
            <mat-error>
                <div *ngIf='repeatPasswordInput.errors?.required'>Please repeat the new password</div>
                <div *ngIf='repeatPasswordInput.errors?.minlength'>Password must be at least 6 characters long</div>
                <div *ngIf='repeatPasswordInput.errors?.repeat'>Passwords don't match</div>
            </mat-error>
        </mat-form-field>

        <div class='form-group button-group' fx-layout='start center'>
            <button mat-button color="secondary" type='button' [disabled]='this.submitting' (click)='goToLogin()'>
                Back to login
            </button>
            <button mat-raised-button color="primary" type='submit' [disabled]='rpForm.invalid || this.success || this.submitting'>
                Reset password
            </button>
        </div>

        <br>

        <mat-progress-bar mode="query" *ngIf='submitting'></mat-progress-bar>

        <div class="form-group">
            <div class="error-color" role="alert" *ngIf="error" fxLayoutAlign='start center'>
                <mat-icon>error</mat-icon>
                An error occurred while sending request
            </div>
            <div class="success-color" role="alert" *ngIf="success" fxLayoutAlign='start center'>
                <mat-icon>check_circle</mat-icon>
                Your password has been changed
            </div>
        </div>
    </form>
</div>
