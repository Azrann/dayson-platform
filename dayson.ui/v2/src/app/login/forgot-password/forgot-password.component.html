<daysonapp-header subtitle='Forgot your password?'>
</daysonapp-header>

<div fxLayout='row' fxLayoutAlign='center center'>
    <form novalidate autocomplete="off" (ngSubmit)="forgotPassword()" #fpForm='ngForm' fxLayout='column' fxLayoutAlign='start stretch'>
        <p>
            Tell us what your email was, and we'll send you a instructions for resetting your password.
        </p>

        <mat-form-field>
            <input name="email" matInput email placeholder="Email address" maxlength="50" required [(ngModel)]='emailAddress' #email='ngModel'
                [disabled]='this.success || this.submitting'>
            <mat-error>
                <div *ngIf='email.errors?.required'>Email is required</div>
                <div *ngIf='email.errors?.email'>Invalid email</div>
                <div *ngIf='email.errors?.maxlength'>Length must be maximum 50 characters long</div>
            </mat-error>
        </mat-form-field>

        <div class='form-group button-group' fx-layout='start center'>
            <button mat-button color="secondary" type='button' [disabled]='this.submitting' (click)='goToLogin()'>
                Back to login
            </button>
            <button mat-raised-button color="primary" type='submit' [disabled]='fpForm.invalid || this.success || this.submitting'>
                Send me a reset link
            </button>
        </div>

        <br>

        <mat-progress-bar mode="query" *ngIf='submitting'></mat-progress-bar>

        <div class="form-group">
            <div class="error-color" role="alert" *ngIf="error" fxLayoutAlign='start center'>
                <mat-icon>error</mat-icon>
                An error occurred while sending request
            </div>
            <div class="success-color" role="alert" *ngIf="success" fxLayoutAlign='start center'>
                <mat-icon>check_circle</mat-icon>
                A reset password email has been sent to the specified address
            </div>
        </div>

    </form>
</div>
