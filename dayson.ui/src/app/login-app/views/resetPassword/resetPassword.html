
<a class='dayson-app-tile' href='#/'>
  <h1>DaysON</h1>
</a>
<div class='container'>

  <div class='row'>
    <div class='col-sm-8 col-sm-offset-2 col-md-6 col-md-offset-3'>
      <form name='form' class='panel panel-default login-panel' novalidate ng-submit='vm.executeRequest()'>
        <div class="panel-heading">
          <h3 class="panel-title">Reset password</h3>
        </div>
        <div class='panel-body'>
          <div class='form-group'>
            <p>
              You have requested a password reset.
            </p>
            <p>
              Please enter you new password in order to change it.
            </p>
          </div>
          <div class='form-group has-feedback' ng-class='{"has-error": form.password.$invalid && form.password.$touched}'>
            <input type='password' name='password' class='form-control' placeholder="new password" ng-disabled='vm.requestSent' ng-required='true' equals='{{vm.repeatPassword}}' ng-model='vm.password'>
            <span class="glyphicon glyphicon-remove form-control-feedback" aria-hidden="true" ng-show='form.password.$invalid && form.password.$touched'></span>
            <span class="glyphicon glyphicon-asterisk form-control-feedback" aria-hidden="true" ng-show='!(form.password.$invalid && form.password.$touched)'></span>
          </div>
          <div class='form-group has-feedback' ng-class='{"has-error": form.repeatPassword.$invalid && form.repeatPassword.$touched}'>
            <input type='password' name='repeatPassword' class='form-control' placeholder="repeat password" ng-disabled='vm.requestSent' ng-required='true' equals='{{vm.password}}' ng-model='vm.repeatPassword'>
            <span class="glyphicon glyphicon-remove form-control-feedback" aria-hidden="true" ng-show='form.repeatPassword.$invalid && form.repeatPassword.$touched'></span>
            <span class="glyphicon glyphicon-asterisk form-control-feedback" aria-hidden="true" ng-show='!(form.repeatPassword.$invalid && form.repeatPassword.$touched)'></span>
          </div>

          <!-- errors -->
          <div ng-messages="form.$error" role="alert" ng-messages-multiple ng-show='!vm.requestSent && (form.$invalid || vm.errors)'>
            <div class='alert alert-danger'>
              <div ng-message="required">
                <span class='glyphicon glyphicon-exclamation-sign' aria-hidden="true"></span>
                Please enter all required fields
              </div>
              <div ng-message="equals">
                <span class='glyphicon glyphicon-exclamation-sign' aria-hidden="true"></span>
                Passwords don't match
              </div>
            </div>
          </div>

          <div class='form-group' ng-hide='vm.requestSent'>
            <button type='submit' class='btn btn-primary' ng-disabled='form.$invalid'>
              Set password
            </button>
          </div>

          <div class='alert alert-success' ng-show='vm.requestSent'>
            <div>
              <span class='glyphicon glyphicon-ok' aria-hidden="true"></span>
              You password has been reset!
            </div>
          </div>
          <div class='form-group' ng-show='vm.requestSent'>
            <a type='button' class='btn btn-success' href='#/'>
              Go back to login
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
